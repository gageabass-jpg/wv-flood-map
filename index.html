  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1e72fdb8-2ee5-4383-8754-b0d4e9f79601\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body{margin:0;background:#f3f1ec;}\n    a{color:#7e1f1a;text-decoration:none;}\n    a:hover{text-decoration:underline;}\n    b{font-weight:600;}\n  <\u002Fstyle>\n  <script src=\"cec34439-a42d-4c75-8671-cbe385a394b1\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"background:#f3f1ec;padding:clamp(14px,3vw,32px);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;color:#232a31;line-height:1.5;-webkit-font-smoothing:antialiased;\">\n  <div style=\"max-width:860px;margin:0 auto;zoom:0.8;background:#ffffff;border:1px solid #e2ddd3;border-radius:14px;box-shadow:0 1px 2px rgba(30,26,20,.06),0 12px 30px rgba(30,26,20,.07);overflow:hidden;\">\n\n    <div style=\"padding:clamp(20px,3vw,32px) clamp(20px,3vw,32px) 0;\">\n      <p style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7e1f1a;font-weight:600;margin:0 0 10px;\"><span style=\"letter-spacing: 0.14em;\">WEST VIRGINIA FLOODING - 2025-2026<\u002Fspan><\u002Fp>\n      <h1 style=\"font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(26px,4.2vw,42px);line-height:1.04;margin:0;letter-spacing:-.01em;text-wrap:balance;\">FEMA Claims by County<\u002Fh1>\n      \n      \n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showComparison }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:#e2ddd3;border-top:1px solid #e2ddd3;border-bottom:1px solid #e2ddd3;margin-top:clamp(20px,3vw,28px);\">\n        <sc-for list=\"{{ compare }}\" as=\"e\" hint-placeholder-count=\"2\">\n          <div style=\"{{ e.cardStyle }}\" sc-camel-on-click=\"{{ e.onClick }}\">\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <span style=\"width:11px;height:11px;border-radius:2px;flex:none;background:{{ e.color }};\"><\u002Fspan>\n              <span style=\"font-weight:600;font-size:14px;\">{{ e.name }}<\u002Fspan>\n              <span style=\"color:#657081;font-size:12px;\">{{ e.num }}<\u002Fspan><b style=\"font-size: 11.5px; margin-left: auto; color: #9aa0a8; font-weight: 600; white-space: nowrap\">Data as of Aug 15, 2026<\u002Fb>\n            <\u002Fdiv>\n            <div style=\"color:#657081;font-size:12px;margin:2px 0 10px 19px;\">{{ e.region }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:baseline;gap:8px;margin-left:19px;\">\n              <span style=\"font-family:'Spectral',Georgia,serif;font-size:clamp(24px,3.4vw,32px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;\">{{ e.claims }}<\u002Fspan>\n              <span style=\"color:#657081;font-size:12px;\">households claimed<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:5px;border-radius:3px;background:#f0ece3;margin:9px 0 12px 19px;overflow:hidden;\">\n              <div style=\"height:100%;width:{{ e.barPct }}%;background:{{ e.color }};border-radius:3px;transition:width .4s;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px 16px;margin-left:19px;font-size:12px;color:#657081;\">\n              <span style=\"white-space:nowrap;\"><b style=\"color:#232a31;font-variant-numeric:tabular-nums;\">{{ e.counties }}<\u002Fb> counties<\u002Fspan>\n              <span style=\"position:relative;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;\">\n                <span style=\"white-space:nowrap;\"><b style=\"color:#232a31;font-variant-numeric:tabular-nums;\">{{ e.destroyed }}<\u002Fb> homes destroyed<\u002Fspan>\n                <span sc-camel-on-mouse-enter=\"{{ e.onInfoEnter }}\" sc-camel-on-mouse-leave=\"{{ e.onInfoLeave }}\" style=\"width:14px;height:14px;border-radius:50%;border:1px solid #b9c0c9;color:#8a93a0;font-size:9.5px;font-weight:700;font-style:italic;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex:none;font-family:Georgia,serif;\">i<\u002Fspan>\n                <sc-if value=\"{{ e.infoOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"position:absolute;bottom:calc(100% + 8px);left:0;width:250px;background:#232a31;color:#f3f1ec;font-size:11.5px;line-height:1.45;font-weight:400;padding:10px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:20;text-wrap:pretty;\">FEMA inspectors sort flood-damaged homes into four levels: <b style=\"color:#fff;\">Affected<\u002Fb> (cosmetic), <b style=\"color:#fff;\">Minor<\u002Fb> and <b style=\"color:#fff;\">Major<\u002Fb> (repairable), and <b style=\"color:#fff;\">Destroyed<\u002Fb>: a total loss that is permanently uninhabitable or not economically repairable.<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"white-space:nowrap;\"><b style=\"color:#232a31;font-variant-numeric:tabular-nums;\">{{ e.ihp }}<\u002Fb> FEMA aid<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(18px,2.6vw,30px);padding:clamp(20px,3vw,30px);\">\n      <div style=\"position: relative; min-height: 300px; align-self: center\">\n        {{ map }}\n        {{ tooltip }}\n        <div style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:16px 52px;align-items:start;\">\n          <sc-if value=\"{{ isClaims }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9aa0a8;font-weight:700;\">Households claiming FEMA aid<\u002Fdiv>\n            <sc-for list=\"{{ legendClaims }}\" as=\"lg\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:10px;\">\n                <span style=\"font-size:11px;color:#657081;min-width:34px;font-weight:700;font-variant-numeric:tabular-nums;\">{{ lg.title }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;\">\n                  <sc-for list=\"{{ lg.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n                    <span title=\"{{ it.lab }}\" style=\"width:24px;height:13px;background:{{ it.c }};\"><\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;align-items:center;gap:10px;font-size:10.5px;color:#8a8f96;\">\n              <span style=\"min-width:34px;\"><\u002Fspan>\n              <span style=\"display:inline-flex;justify-content:space-between;width:120px;\"><span>fewer<\u002Fspan><span>more →<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;font-size:11px;color:#657081;\">\n              <span style=\"width:24px;height:13px;background:#e9e5db;border:1px solid rgba(0,0,0,.06);display:inline-block;flex:none;\"><\u002Fspan>\n              <span>No FEMA claims<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showStatusLegend }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9aa0a8;font-weight:700;\">2026 FEMA status<\u002Fdiv>\n            <sc-for list=\"{{ legendStatus }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:9px;font-size:11.5px;color:#657081;\">\n                <span style=\"width:14px;height:14px;border-radius:{{ s.rad }};background:{{ s.c }};border:{{ s.bd }};box-sizing:border-box;flex:none;\"><\u002Fspan>\n                <span>{{ s.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      \n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid #e2ddd3;padding:14px clamp(20px,3vw,32px);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;font-size:11.5px;color:#657081;\">\n      <span>Source: <a href=\"https://www.fema.gov/openfema-data-page/individuals-and-households-program-valid-registrations-v1\" target=\"_blank\" rel=\"noopener\">OpenFEMA<\u002Fa> Individuals &amp; Households Program · Boundaries: US Census TIGER/Line<\u002Fspan>\n      <span>Metrics: Valid FEMA registrations per county&nbsp;<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 720, &quot;height&quot;: 600},\n  &quot;defaultView&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;2025&quot;,&quot;2026&quot;,&quot;status&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},\n  &quot;showComparison&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},\n  &quot;scaleMode&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shared&quot;,&quot;per-event&quot;],&quot;default&quot;:&quot;shared&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;}\n}\">\nclass Component extends DCLogic {\n  state = { loaded:false, mode:null, sel:null, hover:null, hoverName:null, info:null };\n\n  RAMP = {\n    red:    ['oklch(0.88 0.05 45)','oklch(0.79 0.09 40)','oklch(0.66 0.13 35)','oklch(0.52 0.15 32)','oklch(0.41 0.145 30)'],\n    violet: ['oklch(0.88 0.05 315)','oklch(0.79 0.09 312)','oklch(0.66 0.125 308)','oklch(0.53 0.145 304)','oklch(0.43 0.15 300)'],\n    teal:   ['oklch(0.88 0.045 210)','oklch(0.79 0.085 216)','oklch(0.66 0.11 224)','oklch(0.52 0.125 234)','oklch(0.42 0.13 244)'],\n  };\n  _ramp(ev){ return this.RAMP[ev.hue] || this.RAMP.red; }\n  NODMG = '#e9e5db';\n  MUTE  = '#e3e4e6';\n  STATUS_META = {\n    order:  ['declared','requested','planning','denied','affected'],\n    labels: {declared:'', requested:'Requested \\n', planning:'Planning to request', denied:'Denied and appealing', affected:'Affected, SOE Declared'},\n    colors: {declared:'#2f8f6b', requested:'#c98a1e', planning:'#3f77c2', denied:'#b0322a', affected:'#9aa1ad'},\n  };\n  YEAR_HUE = {'2025':'red','2026':'teal'};\n  _yramp(year){ return this.RAMP[this.YEAR_HUE[year]] || this.RAMP.red; }\n\n  componentDidMount(){ this._boot(); }\n  componentWillUnmount(){ if(this._t) clearTimeout(this._t); }\n  _boot(){\n    const d = (typeof window!=='undefined') ? window.FLOOD_DATA : null;\n    if(!d){ this._t=setTimeout(()=>this._boot(),40); return; }\n    this.GEO=d.GEO; this.EVENTS=d.EVENTS; this.ORDER=d.ORDER; this.STATUS=d.STATUS||{};\n    this._proj(); this._index();\n    this.setState({loaded:true});\n  }\n\n  _proj(){\n    let minLon=1e9,maxLon=-1e9,minLat=1e9,maxLat=-1e9;\n    const eachRing=(g,cb)=>{const t=g.type,c=g.coordinates;\n      if(t==='Polygon')c.forEach(r=>cb(r));\n      else if(t==='MultiPolygon')c.forEach(p=>p.forEach(r=>cb(r)));};\n    this.GEO.features.forEach(f=>eachRing(f.geometry,r=>r.forEach(([x,y])=>{\n      if(x<minLon)minLon=x;if(x>maxLon)maxLon=x;if(y<minLat)minLat=y;if(y>maxLat)maxLat=y;})));\n    const midLat=(minLat+maxLat)/2, kx=Math.cos(midLat*Math.PI/180);\n    const W=680,H=470,P=14;\n    const gw=(maxLon-minLon)*kx, gh=(maxLat-minLat);\n    const sc=Math.min((W-2*P)/gw,(H-2*P)/gh);\n    const ox=(W-gw*sc)/2, oy=(H-gh*sc)/2;\n    const px=x=>ox+((x-minLon)*kx)*sc, py=y=>oy+((maxLat-y))*sc;\n    const ringPath=r=>r.map(([x,y],i)=>(i?'L':'M')+px(x).toFixed(1)+' '+py(y).toFixed(1)).join('')+'Z';\n    this.W=W; this.H=H; this._d={};\n    this.GEO.features.forEach(f=>{let d='';eachRing(f.geometry,r=>d+=ringPath(r));this._d[f.properties.NAME]=d;});\n  }\n\n  _index(){\n    this.byCounty={}; this.totals={};\n    this.ORDER.forEach(k=>{\n      const ev=this.EVENTS[k], cs=Object.values(ev.data);\n      this.totals[k]={\n        claims:cs.reduce((a,b)=>a+b.claims,0),\n        damaged:cs.reduce((a,b)=>a+b.homeDamage,0),\n        destroyed:cs.reduce((a,b)=>a+b.destroyed,0),\n        ihp:cs.reduce((a,b)=>a+b.ihp,0),\n        counties:cs.length,\n        max:Math.max.apply(null,cs.map(c=>c.claims)),\n      };\n      Object.entries(ev.data).forEach(([name,rec])=>{ this.byCounty[name]={key:k,rec}; });\n    });\n    this.globalMax=Math.max.apply(null,Object.values(this.byCounty).map(c=>c.rec.claims));\n    this.maxTotal=Math.max.apply(null,this.ORDER.map(k=>this.totals[k].claims));\n    this.YEARS=[...new Set(this.ORDER.map(k=>this.EVENTS[k].yr))];\n    this.yearClaims={}; this.YEARS.forEach(y=>{ this.yearClaims[y]=this.ORDER.filter(k=>this.EVENTS[k].yr===y)\n      .reduce((a,k)=>a+this.totals[k].claims,0); });\n    this.maxYear=Math.max.apply(null,this.YEARS.map(y=>this.yearClaims[y]));\n  }\n\n  _fmt(n){ return Number(n).toLocaleString('en-US'); }\n  _usd(n){ const v=Math.round(n);\n    if(v>=1e6) return '$'+(v/1e6).toFixed(1)+'M';\n    if(v>=1e3) return '$'+Math.round(v/1e3)+'k';\n    return '$'+v.toLocaleString('en-US'); }\n\n  _bucket(claims,key){\n    const scale=(this.props&&this.props.scaleMode)||'shared';\n    if(scale==='per-event'){\n      const max=this.totals[key].max||1, f=claims/max;\n      return f>=.75?4:f>=.5?3:f>=.25?2:f>=.05?1:0;\n    }\n    return claims>=1200?4:claims>=700?3:claims>=300?2:claims>=100?1:0;\n  }\n\n  _select(name){ this.setState(s=>({sel:s.sel===name?null:name})); }\n\n  _hover(name,e){\n    const svg=e.target.ownerSVGElement; if(!svg)return;\n    const rect=svg.getBoundingClientRect();\n    // account for any ancestor zoom/scale: convert screen px -> local css px\n    const zoom = svg.clientWidth ? rect.width/svg.clientWidth : 1;\n    const lx=(e.clientX-rect.left)/zoom, ly=(e.clientY-rect.top)/zoom;\n    // anchor the tooltip's top-left corner at the cursor (grows right & down)\n    let x=lx+10, y=ly+10;\n    if(x<0) x=0;\n    this.setState({hover:{name,x,y}, hoverName:name});\n  }\n\n  _btnStyle(pressed){\n    return {fontFamily:'inherit',fontSize:'13px',fontWeight:600,cursor:'pointer',border:0,\n      background:pressed?'#ffffff':'transparent',color:pressed?'#232a31':'#657081',\n      padding:'7px 14px',borderRadius:'6px',lineHeight:1.15,textAlign:'left',\n      boxShadow:pressed?'0 1px 2px rgba(30,26,20,.14)':'none',transition:'background .14s,color .14s'};\n  }\n\n  renderVals(){\n    const showComparison = this.props && this.props.showComparison!==undefined ? this.props.showComparison : true;\n    if(!this.state.loaded){\n      return { loaded:false, showComparison, modes:[], compare:[], rows:[], legendClaims:[], legendStatus:[], showStatusLegend:false,\n        noteText:'', map:null, tooltip:null, isStatus:false, isClaims:true, showDenied:false };\n    }\n    const R=this.RAMP;\n    const mode = this.state.mode || (this.props&&this.props.defaultView) || 'both';\n    const per = ((this.props&&this.props.scaleMode)||'shared')==='per-event';\n\n    const dots=this.ORDER.map(k=>this._ramp(this.EVENTS[k])[4]);\n    const seg=100/dots.length;\n    const bothDot='linear-gradient(135deg,'+dots.map((c,i)=>c+' '+Math.round(i*seg)+'% '+Math.round((i+1)*seg)+'%').join(',')+')';\n    const isStatus = mode==='status';\n    const overlayStatus = mode==='both';\n    const showDenied = isStatus || overlayStatus;\n    const statusDot='linear-gradient(135deg,'+this.STATUS_META.order.map((s,i)=>this.STATUS_META.colors[s]+' '+Math.round(i*20)+'% '+Math.round((i+1)*20)+'%').join(',')+')';\n    const modeDefs=[\n      {key:'both', label:'All events', sub:'2025–2026', dotColor:bothDot},\n      ...this.ORDER.map(k=>({key:k, label:this.EVENTS[k].short, sub:this.EVENTS[k].num, dotColor:this._ramp(this.EVENTS[k])[4]})),\n      {key:'status', label:'2026 Status', sub:'27 counties', dotColor:statusDot},\n    ];\n    const modes=modeDefs.map(m=>({...m, style:this._btnStyle(mode===m.key),\n      onClick:()=>this.setState({mode:m.key, sel:null, hover:null})}));\n\n    const compare=this.YEARS.map(y=>{\n      const ks=this.ORDER.filter(k=>this.EVENTS[k].yr===y);\n      const cs=ks.flatMap(k=>Object.values(this.EVENTS[k].data));\n      const claims=cs.reduce((a,b)=>a+b.claims,0), destroyed=cs.reduce((a,b)=>a+b.destroyed,0), ihp=cs.reduce((a,b)=>a+b.ihp,0);\n      const color=this._yramp(y)[4];\n      const active=(mode==='both'||mode===y);\n      const parts=ks.map(k=>this.EVENTS[k].dates);\n      const yrs=parts.map(p=>p.split(', ')[1]);\n      const dateRange=(parts.length>1 && yrs.every(v=>v===yrs[0]))\n        ? parts.map(p=>p.split(', ')[0]).join(' & ')+', '+yrs[0]\n        : parts.join(' · ');\n      return { key:y, name:y, num:ks.map(k=>this.EVENTS[k].num).join(' · '), region:dateRange, color,\n        claims:this._fmt(claims), counties:cs.length, destroyed, ihp:this._usd(ihp),\n        barPct:Math.round(claims/this.maxYear*100),\n        cardStyle:{background:'#ffffff',padding:'16px clamp(16px,2.4vw,24px)',cursor:'pointer',\n          opacity:active?1:0.4, transition:'opacity .2s,box-shadow .2s',\n          boxShadow:mode===y?('inset 3px 0 0 '+color):'none'},\n        onClick:()=>this.setState({mode:mode===y?'both':y, sel:null}),\n        infoOpen:this.state.info===y,\n        onInfoEnter:()=>this.setState({info:y}),\n        onInfoLeave:()=>this.setState({info:null}) };\n    });\n\n    let entries=Object.entries(this.byCounty)\n      .filter(kv=> mode==='both'||kv[1].key===mode)\n      .map(kv=>({name:kv[0], key:kv[1].key, ...kv[1].rec}))\n      .sort((a,b)=>b.claims-a.claims);\n    const rows=entries.map((r,i)=>{\n      const ev=this.EVENTS[r.key];\n      const color=this._ramp(ev)[3];\n      const sel=this.state.sel===r.name;\n      return { rank:i+1, name:r.name, region:ev.short, color,\n        claims:this._fmt(r.claims),\n        subText:this._fmt(r.homeDamage)+' homes damaged'+(r.destroyed?' · '+r.destroyed+' destroyed':''),\n        barPct:Math.max(4,Math.round(r.claims/this.globalMax*100)),\n        rowStyle:{display:'grid',gridTemplateColumns:'8px 1fr auto',alignItems:'center',gap:'12px',\n          padding:'9px 10px',borderRadius:'8px',cursor:'pointer',\n          background:sel?'#f3f1ec':'transparent',transition:'background .12s'},\n        onClick:()=>this._select(r.name),\n        onEnter:()=>this.setState({hoverName:r.name}),\n        onLeave:()=>this.setState({hoverName:null}) };\n    });\n\n    const labs = per ? ['fewer','','','','more'] : ['1–99','100–299','300–699','700–1,199','1,200+'];\n    const yearsForLegend = (mode==='2025'||mode==='2026') ? [mode] : this.YEARS;\n    const legendClaims = yearsForLegend.map(y=>({title:y, items:this._yramp(y).map((c,i)=>({c, lab:labs[i]}))}));\n    const legendStatus = this.STATUS_META.order.filter(s=>this.STATUS_META.labels[s]).map(s=>({label:this.STATUS_META.labels[s], c:this.STATUS_META.colors[s], bd: s==='denied'?'3px dashed #000':'1px solid rgba(0,0,0,.06)', rad: s==='denied'?'1px':'3px'}));\n    const showStatusLegend = isStatus || overlayStatus;\n\n    const totalCounties=Object.keys(this.byCounty).length;\n    const noteText = isStatus\n      ? '27 WV counties with documented 2026 flooding, colored by FEMA status.'\n      : mode==='both'\n        ? 'All '+totalCounties+' counties with FEMA claims across 2025 and 2026, ranked by households.'\n        : 'Counties with FEMA claims in '+mode+'.';\n\n    // ---- map ----\n    const paths=this.GEO.features.map(f=>{\n
